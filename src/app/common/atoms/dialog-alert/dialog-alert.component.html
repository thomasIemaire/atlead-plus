<p-dialog [draggable]="false" [modal]="true" [(visible)]="visible" [closable]="false" [resizable]="false"
    [style]="{ width: '30rem' }" [showHeader]="false" >
    <div class="dialog-wrapper">
        <div class="icon">
            <ng-lottie [options]="icon"></ng-lottie>
        </div>
        <div class="title">
            {{ title }}
        </div>
        <div class="message">
            {{ message }}
        </div>
    </div>
    <div class="dialog-footer">
        <p-button label="Annuler" variant="text" severity="secondary" (click)="hideDialog()"/>
        <p-button label="Continuer" (click)="hideDialog()"/>
    </div>
</p-dialog>
